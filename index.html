<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabuzio Deal – Watch Deals</title>
<meta name="description" content="Affordable automatic, chronograph and diver watches from AliExpress at the best price. New deals every day.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌚</text></svg>">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#14213d;--muted:#5c6b80;--accent:#1f7ae0;--accent2:#22a06b;--line:#e3e8ef}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#182131;--text:#e9eef5;--muted:#9aa8bb;--line:#2a3547}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px;text-align:center}
h1{margin:0;font-size:24px}
.sub{color:var(--muted);margin:4px 0 12px}
.tg{display:inline-block;background:#229ED9;color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600}
.bar{background:var(--bg);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}
.bar input,.bar select{flex:1 1 150px;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.count{width:100%;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff}
.info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;line-height:1.3;margin:0}
.brand{font-size:12px;color:var(--muted)}
.price{font-size:18px;font-weight:700;color:var(--accent2)}
.btn{margin-top:auto;text-align:center;background:var(--accent);color:#fff;text-decoration:none;padding:9px;border-radius:10px;font-weight:600;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 40px}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<header>
  <h1>⌚ Kabuzio Deal</h1>
  <p class="sub">Affordable watches from AliExpress at the best price</p>
  <a class="tg" href="https://t.me/KabuzioDeal" target="_blank" rel="noopener">🔔 New deals every day on Telegram</a>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="🔍 Search watches…">
  <select id="price"><option value="">💰 Any price</option><option value="0-50">Under $50</option><option value="50-100">$50 – $100</option><option value="100-99999">Over $100</option></select>
  <select id="type"><option value="">⌚ Any type</option></select>
  <select id="brand"><option value="">🏷 Any brand</option></select>
  <select id="sort"><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
  <div class="count" id="count"></div>
</div>
<main id="grid"><div class="msg">Loading deals…</div></main>
<footer>Ad · We earn a commission from purchases made through these links, at no extra cost to you. Prices may change on AliExpress.</footer>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQRH7X54O1GzNSUWnIgBT1545CXdQMaZ7HOzKOyJC6mZKyXG9gxJ9T5DBbAv0WzbkZXOdHrW8ubzUwS/pub?gid=423383887&single=true&output=csv";
const TYPES=[["chronograph","Chronograph"],["dive","Diver"],["smart","Smartwatch"],["automatic","Automatic"],["mechanical","Automatic"],["tourbillon","Automatic"],["skeleton","Automatic"],["quartz","Quartz"]];
let items=[];
const $=id=>document.getElementById(id);
const num=s=>parseFloat(String(s||"").replace(/[^0-9.]/g,""))||0;
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function typeOf(n){n=n.toLowerCase();for(const[k,v]of TYPES)if(n.includes(k))return v;return "Other"}
function pick(r,names,i){for(const n of names)if(r[n]!==undefined)return r[n];return Object.values(r)[i]}
function fill(sel,vals){[...new Set(vals)].filter(Boolean).sort().forEach(v=>{const o=document.createElement("option");o.value=o.textContent=v;sel.appendChild(o)})}
function render(){
  const q=$("q").value.toLowerCase().trim(),[lo,hi]=($("price").value||"0-999999").split("-").map(Number),t=$("type").value,b=$("brand").value,s=$("sort").value;
  let list=items.filter(x=>(!q||(x.name+" "+x.brand+" "+x.tags).toLowerCase().includes(q))&&x.price>=lo&&x.price<hi&&(!t||x.type===t)&&(!b||x.brand===b));
  if(s==="low")list.sort((a,b)=>a.price-b.price);else if(s==="high")list.sort((a,b)=>b.price-a.price);else list.sort((a,b)=>b.i-a.i);
  $("count").textContent=list.length+" deals";
  $("grid").innerHTML=list.length?list.map(x=>`<div class="card"><img loading="lazy" src="${esc(x.img)}_480x480.jpg" onerror="this.onerror=null;this.src='${esc(x.img)}'" alt="${esc(x.name)}"><div class="info"><p class="name">${esc(x.name)}</p><span class="brand">${esc(x.brand)} · ${esc(x.type)}</span><span class="price">${esc(x.priceText)}</span><a class="btn" href="${esc(x.link)}" target="_blank" rel="nofollow sponsored noopener">See deal 👉</a></div></div>`).join(""):'<div class="msg">No deals found. Try another filter.</div>';
}
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=""}else if(c=='\n'){row.push(f);rows.push(row);row=[];f=""}else if(c!='\r')f+=c}if(f||row.length){row.push(f);rows.push(row)}const h=rows.shift()||[];return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]])))}
fetch(CSV).then(r=>r.text()).then(t=>{
  items=parseCSV(t).map((r,i)=>{const name=pick(r,["Producto"],0),brand=pick(r,["Marca"],5);return{i,name,priceText:pick(r,["Precio"],1),price:num(pick(r,["Precio"],1)),img:pick(r,["Imagen_URL"],2),link:pick(r,["Enlace"],3),tags:pick(r,["Categoria"],4)||"",brand:(!brand||brand==="Sin marca")?"Other":brand,type:typeOf(name||"")}}).filter(x=>x.name&&x.link&&/^https:\/\//.test(x.link));
  fill($("type"),items.map(x=>x.type));fill($("brand"),items.map(x=>x.brand));render();
}).catch(()=>{$("grid").innerHTML='<div class="msg">Could not load deals. Please refresh.</div>'});
["q","price","type","brand","sort"].forEach(id=>$(id).addEventListener("input",render));
</script>
</body>
</html>
