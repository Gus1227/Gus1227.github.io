name: Bot Telegram
on:
  # Cada 2 h, minuto 5 (Telegram ya está apagado en Make: escenario 7725903, input telegram = false).
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "¿Publicar de verdad? (no = solo prueba)"
        type: choice
        options: ["no", "si"]
        default: "no"
      zernio:
        description: "TikTok / Pinterest por Zernio (en vez de Telegram)"
        type: choice
        options: ["nada", "tiktok", "pinterest", "tiktok pinterest"]
        default: "nada"
      fila:
        description: "Solo revisar: número de fila, o «links» para revisar todos los links, «arreglar» (prueba), «arreglar-si» (escribe) o «posts» (corrige los posts publicados)"
        required: false
        default: ""
concurrency: bot-telegram
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: Publicar el siguiente reloj
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PUBLICAR: ${{ github.event_name == 'schedule' && 'si' || inputs.publicar }}
        run: python3 bot/telegram.py
        if: ${{ !inputs.fila && (github.event_name == 'schedule' || inputs.zernio == 'nada') }}
      - name: TikTok y Pinterest (Zernio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.zernio != 'nada' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          REDES: ${{ inputs.zernio }}
          PUBLICAR: ${{ inputs.publicar }}
        run: python3 bot/zernio.py
      - name: Revisar una fila
        if: ${{ inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FILA: ${{ inputs.fila }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          case "$FILA" in
            links) python3 bot/revisar_links.py ;;
            arreglar) python3 bot/arreglar_links.py ;;
            arreglar-si) ARREGLAR=si python3 bot/arreglar_links.py ;;
            posts) python3 bot/corregir_posts.py ;;
            huecos) python3 bot/huecos.py ;;
            poner-links) python3 bot/poner_links.py ;;
            *) python3 bot/revisar_fila.py ;;
          esac
