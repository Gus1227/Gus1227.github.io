name: Bot Kabuzio
on:
  # Solo a mano. Lo automático está en bot-horario.yml.
  workflow_dispatch:
    inputs:
      publicar:
        description: "¿Publicar de verdad? (no = solo prueba)"
        type: choice
        options: ["no", "si"]
        default: "no"
      red:
        description: "¿En qué red publicar?"
        type: choice
        options: ["telegram", "tiktok", "pinterest"]
        default: "telegram"
      reloj:
        description: "Número de fila de un reloj concreto (vacío = el siguiente de la cola)"
        required: false
        default: ""
      fila:
        description: "(Solo para Claude) Revisar: número de fila, o «links» para revisar todos los links, «arreglar» (prueba), «arreglar-si» (escribe) o «posts» (corrige los posts publicados)"
        required: false
        default: ""
concurrency: bot-telegram
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install cryptography
          git config user.name "kabuzio-bot"
          git config user.email "kabuzio-bot@users.noreply.github.com"
      - name: Publicar el siguiente reloj
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PUBLICAR: ${{ inputs.publicar }}
          FILA_PUB: ${{ inputs.reloj }}
        run: python3 bot/telegram.py
        if: ${{ !inputs.fila && inputs.red == 'telegram' }}
      - name: TikTok y Pinterest (Zernio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.red != 'telegram' && !inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          REDES: ${{ inputs.red }}
          PUBLICAR: ${{ inputs.publicar }}
          FILA_PUB: ${{ inputs.reloj }}
        run: python3 bot/zernio.py
      - name: Revisar una fila
        if: ${{ inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FILA: ${{ inputs.fila }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
        run: |
          case "$FILA" in
            links) python3 bot/revisar_links.py ;;
            arreglar) python3 bot/arreglar_links.py ;;
            arreglar-si) ARREGLAR=si python3 bot/arreglar_links.py ;;
            posts) python3 bot/corregir_posts.py ;;
            huecos) python3 bot/huecos.py ;;
            poner-links) python3 bot/poner_links.py ;;
            stats) DEBUG=1 python3 bot/stats.py && git add stats.json && git commit -qm "bot: seguidores" && git pull -q --rebase origin main && git push -q origin HEAD:main ;;
            top) python3 bot/top.py ;;
            top-si) TOP=si python3 bot/top.py ;;
            marcas) python3 bot/marcas.py ;;
            marcas-si) MARCAS=si python3 bot/marcas.py ;;
            textos) python3 bot/textos.py && python3 bot/telegram.py && REDES=tiktok python3 bot/zernio.py ;;
            textos-si) TEXTOS=si python3 bot/textos.py ;;
            revisar) python3 bot/revisar.py ;;
            revisar-si) REVISAR=si python3 bot/revisar.py ;;
            ali-*) ALI_HACER="${FILA#ali-}" python3 bot/ali.py ;;
            cabecera) python3 -c "import sys;sys.path.insert(0,'bot');import telegram as t;r=t.sheets(t.google_token(),'values/Ofertas!A1:AZ1')['values'][0];print(len(r),list(enumerate(r)))" ;;
            *) python3 bot/revisar_fila.py ;;
          esac
