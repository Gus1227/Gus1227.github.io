name: Bot Telegram
on:
  # Cada 2 h, minuto 5 (Telegram ya está apagado en Make: escenario 7725903, input telegram = false).
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "¿Publicar de verdad? (no = solo prueba)"
        type: choice
        options: ["no", "si"]
        default: "no"
      fila:
        description: "Solo revisar esta fila (número), sin publicar"
        required: false
        default: ""
concurrency: bot-telegram
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: Publicar el siguiente reloj
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PUBLICAR: ${{ github.event_name == 'schedule' && 'si' || inputs.publicar }}
        run: python3 bot/telegram.py
        if: ${{ !inputs.fila }}
      - name: Revisar una fila
        if: ${{ inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FILA: ${{ inputs.fila }}
        run: python3 bot/revisar_fila.py
