name: Bot Kabuzio
on:
  # Solo a mano. Lo automático está en bot-horario.yml.
  workflow_dispatch:
    inputs:
      publicar:
        description: "¿Publicar de verdad? (no = solo prueba)"
        type: choice
        options: ["no", "si"]
        default: "no"
      red:
        description: "¿En qué red publicar?"
        type: choice
        options: ["telegram", "tiktok", "pinterest", "reel"]
        default: "telegram"
      reloj:
        description: "Número de fila de un reloj concreto (vacío = el siguiente de la cola)"
        required: false
        default: ""
      fila:
        description: "(Solo para Claude) Revisar: número de fila, o «links» para revisar todos los links, «arreglar» (prueba), «arreglar-si» (escribe) o «posts» (corrige los posts publicados)"
        required: false
        default: ""
concurrency: bot-telegram
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install cryptography
          sudo rm -f /var/lib/man-db/auto-update  # man-db makes apt-get hang for many minutes on the runners
          APT="sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -q --no-install-recommends tesseract-ocr fonts-dejavu-core"
          $APT || (sudo timeout 120 apt-get update -q && $APT) || true
          # ffmpeg only for Reels (it is big)
          if [ "${{ inputs.red }}" = "reel" ] || [[ "${{ inputs.fila }}" == reel* || "${{ inputs.fila }}" == ejemplo* || "${{ inputs.fila }}" == carrusel* || "${{ inputs.fila }}" == historias* || "${{ inputs.fila }}" == ig-* ]]; then
            sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y -q --no-install-recommends ffmpeg || (sudo timeout 120 apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install -y -q --no-install-recommends ffmpeg)
          fi
          git config user.name "kabuzio-bot"
          git config user.email "kabuzio-bot@users.noreply.github.com"
      - name: Publicar el siguiente reloj
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PUBLICAR: ${{ inputs.publicar }}
          FILA_PUB: ${{ inputs.reloj }}
        run: python3 bot/telegram.py
        if: ${{ !inputs.fila && inputs.red == 'telegram' }}
      - name: TikTok y Pinterest (Zernio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.red != 'telegram' && inputs.red != 'reel' && !inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          REDES: ${{ inputs.red }}
          PUBLICAR: ${{ inputs.publicar }}
          FILA_PUB: ${{ inputs.reloj }}
        run: python3 bot/zernio.py
      - name: Reel elegido en el editor (reloj = «fila:redes», p. ej. «12:instagram,tiktok»)
        if: ${{ inputs.red == 'reel' && !inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PUBLICAR: ${{ inputs.publicar }}
          PEDIDO: ${{ inputs.reloj }}
        run: |
          FILA_R="${PEDIDO%%:*}"
          export REDES="${PEDIDO#*:}"
          if [ "$REDES" = "$PEDIDO" ]; then REDES=""; fi
          set -o pipefail
          {
            if [ "$PUBLICAR" = "si" ]; then export REEL=si; fi
            REEL_FILA="$FILA_R" python3 bot/reel.py && python3 bot/reel_publicar.py
          } 2>&1 | tee /tmp/salida.txt || { echo "::error::$(tail -c 1500 /tmp/salida.txt | tr '\n' '¶')"; exit 1; }
          echo "::notice::$(tail -c 1500 /tmp/salida.txt | tr '\n' '¶')"
      - name: Revisar una fila
        if: ${{ inputs.fila }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FILA: ${{ inputs.fila }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
        run: |
          set -o pipefail
          {
            case "$FILA" in
              links) python3 bot/revisar_links.py ;;
              arreglar) python3 bot/arreglar_links.py ;;
              arreglar-si) ARREGLAR=si python3 bot/arreglar_links.py ;;
              posts) python3 bot/corregir_posts.py ;;
              huecos) python3 bot/huecos.py ;;
              poner-links) python3 bot/poner_links.py ;;
              stats) DEBUG=1 python3 bot/stats.py && git add stats.json && git commit -qm "bot: seguidores" && git pull -q --rebase origin main && git push -q origin HEAD:main ;;
              top) python3 bot/top.py ;;
              top-si) TOP=si python3 bot/top.py ;;
              marcas) python3 bot/marcas.py ;;
              marcas-si) MARCAS=si python3 bot/marcas.py ;;
              textos) python3 bot/textos.py && python3 bot/telegram.py && REDES=tiktok python3 bot/zernio.py ;;
              textos-si) TEXTOS=si python3 bot/textos.py ;;
              meta) python3 bot/meta.py ;;
              meta-prueba) META=facebook python3 bot/meta.py; META=instagram python3 bot/meta.py ;;
              meta-musica) META=musica python3 bot/meta.py ;;
              ig-reels) python3 -c "import sys,json;sys.path.insert(0,'bot');from meta import IG,graph;[print(m.get('timestamp'),m.get('media_product_type'),m.get('permalink'),(m.get('caption') or '')[:60].replace(chr(10),' ')) for m in graph(f'/{IG}/media',{'fields':'id,timestamp,media_product_type,permalink,caption','limit':'30'}).get('data',[])]" ;;
              reel-ig-si) REDES=instagram PUBLICAR=si python3 bot/reel_publicar.py ;;
              meta-fb) META=facebook python3 bot/meta.py ;;
              meta-ig) META=instagram python3 bot/meta.py ;;
              meta-fb-si) META=facebook PUBLICAR=si python3 bot/meta.py ;;
              meta-ig-si) META=instagram PUBLICAR=si python3 bot/meta.py ;;
              respuestas) python3 bot/respuestas.py ;;
              respuestas-si) RESPONDER=si python3 bot/respuestas.py ;;
              tt-respuestas) DEBUG=1 python3 bot/tiktok_respuestas.py ;;
              tt-respuestas-si) RESPONDER=si python3 bot/tiktok_respuestas.py ;;
              fb-respuestas) python3 bot/fb_respuestas.py ;;
              web-check) for u in editor.html index.html catalogo.csv; do echo "$u: $(curl -s -o /dev/null -w '%{http_code}' https://gus1227.github.io/$u)"; done ;;
              fb-respuestas-si) RESPONDER=si python3 bot/fb_respuestas.py ;;
              carrusel) python3 bot/carrusel.py ;;
              carrusel-si) CARRUSEL_SI=si python3 bot/carrusel.py ;;
              historias) python3 bot/historia.py ;;
              historias-si) HISTORIA_SI=si python3 bot/historia.py ;;
              ig-historia-*) HISTORIA="${FILA#ig-historia-}" HISTORIA_SI=si python3 bot/historia.py && IG_EXTRA="historia:${FILA#ig-historia-}" PUBLICAR=si python3 bot/ig_extra.py ;;
              ig-carrusel) CARRUSEL_SI=si python3 bot/carrusel.py && IG_EXTRA=carrusel PUBLICAR=si python3 bot/ig_extra.py ;;
              ig-prueba) IG_EXTRA=historia:dia python3 bot/ig_extra.py && IG_EXTRA=carrusel python3 bot/ig_extra.py ;;
              reel) python3 bot/reel.py ;;
              reel-si) REEL=si python3 bot/reel.py ;;
              reel-[0-9]*) REEL=si REEL_FILA="${FILA#reel-}" python3 bot/reel.py ;;
              ejemplo-[0-9]*) REEL_FILA="${FILA#ejemplo-}" python3 bot/reel.py && cp "$(ls -t r/*.mp4 | head -1)" /tmp/ejemplo.mp4 && mkdir -p ejemplo && mv /tmp/ejemplo.mp4 ejemplo/reel.mp4 && git add ejemplo/reel.mp4 && git commit -qm "bot: reel de ejemplo" && git pull -q --rebase --autostash origin main && git push -q origin HEAD:main ;;
              aviso) AVISO=buscar python3 bot/aviso.py ;;
              aviso-prueba) AVISO=prueba python3 bot/aviso.py ;;
              copia) AVISO=copia python3 bot/aviso.py ;;
              rendimiento) python3 bot/rendimiento.py ;;
              rendimiento-si) RENDIMIENTO=si python3 bot/rendimiento.py ;;
              revisar) python3 bot/revisar.py ;;
              revisar-si) REVISAR=si python3 bot/revisar.py ;;
              ali-*) ALI_HACER="${FILA#ali-}" python3 bot/ali.py && if [ -n "$(git status --porcelain bot/cupones.json bot/estado.json)" ]; then git add bot/cupones.json bot/estado.json && git commit -qm "bot: revisión a mano" && git pull -q --rebase origin main && git push -q origin HEAD:main; fi ;;
              cabecera) python3 -c "import sys;sys.path.insert(0,'bot');import telegram as t;r=t.sheets(t.google_token(),'values/Ofertas!A1:AZ1')['values'][0];print(len(r),list(enumerate(r)))" ;;
              *) python3 bot/revisar_fila.py ;;
            esac
          } 2>&1 | tee /tmp/salida.txt || { echo "::error::$(tail -c 1500 /tmp/salida.txt | tr '\n' '¶')"; exit 1; }
          echo "::notice::$(tail -c 1500 /tmp/salida.txt | tr '\n' '¶')"
