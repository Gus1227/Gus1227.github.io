name: Bot horario
# Publica solo: Telegram + Pinterest cada 2 h, TikTok cada 8 h (ver bot/horario.py).
# Cada vuelta dura ~5.5 h y lanza la siguiente; el cron es solo un respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "35 */3 * * *"
  workflow_dispatch:
concurrency:
  group: bot-horario
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - name: OCR para quitar fotos con texto (bot/fotos.py)
        run: sudo apt-get install -y -q tesseract-ocr || (sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr) || true
      - run: |
          git config user.name "kabuzio-bot"
          git config user.email "kabuzio-bot@users.noreply.github.com"
      - name: Publicar a su hora
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u bot/horario.py
